name: Repair Pages oversized public data asset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apartment-radar-publish
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current data
        run: python scripts/validate.py
      - name: Compact oversized MOLIT file without deleting contracts
        run: python scripts/compact_staging.py
      - name: Verify all public assets are within Pages per-file limit
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path("data").rglob("*.json"):
              size = path.stat().st_size
              print(path, size, "bytes")
              assert size < 25*1024*1024, f"Cloudflare Pages asset too large: {path}"
          PY
      - name: Commit optimized public source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/molit/latest.json
          if git diff --cached --quiet; then
            echo 'Public data already under asset size limit'
          else
            git commit -m 'fix: compact all first-source records for Pages asset limit'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
