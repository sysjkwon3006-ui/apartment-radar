name: Repository tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline MOLIT XML parser tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Strict data approval validation
        run: python scripts/validate.py
