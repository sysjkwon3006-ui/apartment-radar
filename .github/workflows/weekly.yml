name: Weekly MOLIT first-source collection
on:
  workflow_dispatch:
    inputs:
      months:
        description: 'Contract months to refresh (1-24; initial backfill may use 24)'
        required: false
        default: '3'
  schedule:
    # Saturday 07:15 KST is Friday 22:15 UTC
    - cron: '15 22 * * 5'
permissions:
  contents: write
concurrency:
  group: apartment-radar-publish
  cancel-in-progress: false
jobs:
  fetch_molit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data collector offline
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate approved candidate source data
        run: python scripts/validate.py
      - name: Require MOLIT public API key
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo '::error title=API key missing::Add MOLIT_API_KEY to repository Actions secrets before running collection.'
            exit 1
          fi
      - name: Collect latest reported sale and lease contracts
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MONTHS: ${{ github.event.inputs.months || '3' }}
        run: python scripts/collect_molit.py --months "$MONTHS"
      - name: Prepare provisional complex matching review queue
        run: python scripts/match_candidates.py
      - name: Validate that candidate rankings remain evidence-gated
        run: python scripts/validate.py
      - name: Commit FIRST-SOURCE staging and status only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/molit/latest.json data/site-meta.json data/matches/latest.json
          if git diff --cached --quiet; then
            echo 'No staging changes to commit'
          else
            git commit -m 'data: refresh MOLIT primary-source staging (unverified)'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            echo '::error::Could not safely publish after retries'
            exit 1
          fi
      - name: Explain verification boundary
        run: echo 'Only first-source staging, matching review queue and collection status were updated. No records automatically became verified TOP5 candidates.'
