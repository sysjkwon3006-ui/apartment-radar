name: Live Pages deployment smoke
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "dashboard.js"
      - "data/**"
      - "scripts/smoke_live.py"
      - ".github/workflows/live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apartment-radar-live-smoke
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert public Pages deployment and first-source safety
        run: python scripts/smoke_live.py
