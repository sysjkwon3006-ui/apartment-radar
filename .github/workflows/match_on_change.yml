name: Refresh provisional matching review queue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/match_candidates.py'
      - 'scripts/test_matching.py'
      - 'data/molit/latest.json'
      - 'data/complexes.json'
      - '.github/workflows/match_on_change.yml'
permissions:
  contents: write
concurrency:
  group: apartment-radar-match-queue
  cancel-in-progress: false
jobs:
  review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate approved public data
        run: python scripts/validate.py
      - name: Build provisional matching queue from existing staging data
        run: python scripts/match_candidates.py
      - name: Commit ONLY unverified matching queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/matches/latest.json
          if git diff --cached --quiet; then
            echo 'No changes to provisional queue'
          else
            git commit -m 'data: refresh candidate matching review queue (unverified)'
            git push origin main
          fi
      - name: Explain approval boundary
        run: echo 'No data/complexes.json writes, no price approvals and no published verified TOP5.'
